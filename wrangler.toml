name = "konverty-budget"
main = "src/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/offer", "/privacy", "/consent"]

[[durable_objects.bindings]]
name = "USERS"
class_name = "UserStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserStore"]

[vars]
ORIGIN = "https://konverty.app/"
PRICE_RUB = "990"
LEGAL_FIO = "Ширзад Самир Салим"
LEGAL_INN = "222412883999"
LEGAL_CITY = "Алтайский край"
LEGAL_DATE = "19.10.2026"

[triggers]
crons = ["*/5 * * * *"]

[ai]
binding = "AI"

[[routes]]
pattern = "konverty.app"
custom_domain = true
