name = "konverty-budget"
main = "src/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "USERS"
class_name = "UserStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserStore"]

[vars]
ORIGIN = "https://konverty-budget.cshirzad.workers.dev/"
PRICE_STARS = "600"

[triggers]
crons = ["*/5 * * * *"]

[ai]
binding = "AI"
